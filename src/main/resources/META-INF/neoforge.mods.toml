loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/DuskyTheDolphin/dh-quality/issues"

[[mods]]
modId="forgeward_dhquality"
version="1.0.1"
displayName="DH Quality"
authors="DuskyTheDolphin"
displayURL="https://github.com/DuskyTheDolphin/dh-quality"
description='''
Client-only, unofficial (not a Distant Horizons team project). Runs Distant Horizons at vertical quality HIGH, so far
cliffs read as solid faces instead of stripes. An in-memory override: your DistantHorizons.toml is never written. To use
your own setting, turn off forceVerticalHigh in Mods > DH Quality > Config.
'''

[[dependencies.forgeward_dhquality]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.forgeward_dhquality]]
    modId="distanthorizons"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
